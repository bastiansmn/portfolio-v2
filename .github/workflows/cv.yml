# Génère le CV PDF à partir des données du portfolio (data/) et le publie
# comme artefact du workflow : onglet Actions > « Générer le CV PDF » > run > Artifacts.
name: Générer le CV PDF

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/cv/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cv.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/cv/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cv.yml"
  # Permet de relancer la génération à la main depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Generate CV
        run: npm run cv

      - name: Upload CV
        uses: actions/upload-artifact@v4
        with:
          name: CV-Bastian-SOMON
          path: dist/cv/*.pdf
          if-no-files-found: error
          retention-days: 90
